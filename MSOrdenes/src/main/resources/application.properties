quarkus.http.port=8082

quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=CAMBIAR
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/ordenes_db?createDatabaseIfNotExist=true

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# URL del microservicio de productos (cambiar localhost por la IP de otra maquina)
quarkus.rest-client.productos.url=http://localhost:8081

# RabbitMQ (paradigma Routing): MSOrdenes publica cada evento en el exchange direct "direct_logs"
# con su severidad como routing key (info, warning, error).
# Cambiar localhost por la IP de la maquina donde corre RabbitMQ si es otra.
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.username=guest
rabbitmq.password=guest
