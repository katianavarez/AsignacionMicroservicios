quarkus.http.port=8080

# URLs de los microservicios a los que el gateway redirige
# (cambiar localhost por la IP de otra maquina si estan en equipos distintos)
quarkus.rest-client.productos.url=http://localhost:8081
quarkus.rest-client.ordenes.url=http://localhost:8082

# Devolver al cliente los errores (400, 404...) tal cual los responde cada microservicio,
# en lugar de que el cliente REST los convierta en excepciones
microprofile.rest.client.disable.default.mapper=true

# Mostrar en consola cada peticion que pasa por el gateway
quarkus.http.access-log.enabled=true
